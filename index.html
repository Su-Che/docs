<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suganth Chellamuthu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:  #FFFFFF;
      --fog:    #F7F7F5;
      --black:  #0B0B09;
      --text:   #111110;
      --text-2: #525250;
      --text-3: #9A9A96;
      --border: #E4E4E0;
      --serif:  'DM Serif Display', Georgia, serif;
      --sans:   'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--sans);
      background: var(--white);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .gate {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .gate-name {
      font-family: var(--serif);
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -.03em;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }

    .gate-sub {
      font-size: 13px;
      color: var(--text-3);
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 56px;
      text-align: center;
    }

    .gate-form {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gate-label {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 4px;
      display: block;
    }

    .gate-input {
      width: 100%;
      padding: 14px 16px;
      font-family: var(--sans);
      font-size: 15px;
      color: var(--text);
      background: var(--fog);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
    }

    .gate-input:focus {
      border-color: var(--text-3);
    }

    .gate-input.error {
      border-color: #C0392B;
    }

    .gate-btn {
      padding: 14px;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      color: var(--white);
      background: var(--text);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity .2s;
      letter-spacing: .01em;
    }

    .gate-btn:hover { opacity: .82; }
    .gate-btn:active { opacity: .7; }

    .gate-error {
      font-size: 13px;
      color: #C0392B;
      text-align: center;
      min-height: 18px;
      transition: opacity .2s;
    }

    .gate-footer {
      position: fixed;
      bottom: 32px;
      font-size: 12px;
      color: var(--text-3);
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <div class="gate">
    <h1 class="gate-name">Suganth Chellamuthu</h1>
    <p class="gate-sub">Product &amp; Service Design Leader</p>

    <form class="gate-form" onsubmit="check(event)">
      <div>
        <label class="gate-label" for="pw">Password</label>
        <input
          class="gate-input"
          type="password"
          id="pw"
          autocomplete="current-password"
          autofocus
          placeholder="Enter password"
        >
      </div>
      <button class="gate-btn" type="submit">Enter portfolio →</button>
      <p class="gate-error" id="err"></p>
    </form>
  </div>

  <p class="gate-footer">Designed by hand. Built with AI.</p>

  <script>
    // If already authenticated, go straight in
    if (localStorage.getItem('sc_auth') === '1') {
      window.location.replace('home.html');
    }

    function check(e) {
      e.preventDefault();
      var input = document.getElementById('pw');
      var err = document.getElementById('err');
      if (input.value === 'future-human-bliss-sparkle') {
        localStorage.setItem('sc_auth', '1');
        window.location.replace('home.html');
      } else {
        input.classList.add('error');
        err.textContent = 'Incorrect password. Try again.';
        input.value = '';
        input.focus();
        setTimeout(function() { input.classList.remove('error'); }, 1200);
      }
    }
  </script>
</body>
</html>
